configuration:
  plex_url:
    name: Plex server URL
    description: e.g. http://192.168.1.10:32400
  plex_token:
    name: Plex token
    description: Leave blank and use "Sign in with Plex" in the Movie Book panel instead
  plex_library:
    name: Movie library
    description: Name of the Plex library to use
  plex_client:
    name: Plex player
    description: The player's name as Plex shows it, e.g. "Living Room". Also used to show what's playing on the Movie Remote.
  public_base_url:
    name: Tag base URL
    description: Written onto every tag, so use this machine's fixed IP, e.g. http://192.168.1.20:8080
  resume:
    name: Resume
    description: Continue partly watched movies instead of starting over
  ha_script:
    name: Get-ready script
    description: Optional script to run before playing (TV on, HDMI input, open Plex), e.g. script.movie_night
  ha_off_script:
    name: Off script
    description: Optional script for the "TV off" tag, e.g. script.movie_night_off
  ha_player:
    name: Home Assistant Plex player
    description: Optional. Let Home Assistant start the movie on this Plex media_player (recommended for Apple TV)
  player_wait:
    name: Player wait (seconds)
    description: How long to wait for the Plex app to start after the get-ready script
network:
  8080/tcp: Tag URLs (phones and the Movie Remote connect here)
