# Movie Remote: an NFC reader with a touchscreen for Marquee.
#
# Hold a page of the movie book to the reader and the movie starts on your Marquee
# player. The screen shows the poster of what's playing, a progress bar, and touch
# controls. The box pairs with Marquee Server like Marquee does: it shows a code,
# you approve it in the control panel, and nothing works until you do.
#
# Hardware: the Hosyond ESP32-32E E32R40T (4" ST7796, 320x480, XPT2046 touch) with a
# PN532 reader in I2C mode on its I2C header. See esphome/README.md.
# Flash with:  esphome run movie-remote.yaml

substitutions:
  name: movie-remote
  friendly_name: Movie Remote
  # Marquee Server's address (no trailing slash)
  marquee_url: http://marquee.local:8080
  # The PN532 on the I2C header: SDA and SCL
  nfc_sda: GPIO32
  nfc_scl: GPIO25
  # Turn the screen off after this long with nothing playing
  screen_timeout: 5min

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: connect_box

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:

ota:
  - platform: esphome
    password: !secret ota_password

# No Wi-Fi network is built in: on first start the box offers a "Movie Remote"
# hotspot (or set it up over USB at web.esphome.io) and keeps what you choose.
wifi:
  ap:
    ssid: ${friendly_name}

captive_portal:

improv_serial:

http_request:
  timeout: 8s
  verify_ssl: false

# The secret Marquee Server gave the box when you approved it. Kept in flash.
text:
  - platform: template
    id: secret
    name: Secret
    internal: true
    mode: password
    optimistic: true
    restore_value: true
    max_length: 64
    on_value:
      - lambda: 'id(auth) = std::string("Bearer ") + x;'

globals:
  # "Bearer <secret>", for the Authorization header
  - id: auth
    type: std::string
  - id: pair_id
    type: std::string
  - id: pair_code
    type: std::string
  - id: tag_url
    type: std::string
  - id: now_state
    type: std::string
    initial_value: '"connecting"'
  - id: now_title
    type: std::string
  - id: now_key
    type: std::string
  - id: now_poster
    type: std::string
  - id: now_player
    type: std::string
  - id: now_message
    type: std::string
  - id: now_position
    type: int
    initial_value: '0'
  - id: now_duration
    type: int
    initial_value: '0'
  - id: shown_key
    type: std::string

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return !id(secret).state.empty();'
          then:
            - script.execute: refresh
          else:
            - script.execute: pair_poll

script:
  # Paired already: show what's playing. Otherwise ask to pair.
  - id: connect_box
    mode: single
    then:
      - wait_until:
          condition: wifi.connected
      - lambda: 'id(auth) = std::string("Bearer ") + id(secret).state;'
      - if:
          condition:
            lambda: 'return id(secret).state.empty();'
          then:
            - script.execute: pair_start
          else:
            - script.execute: refresh

  # ---- pairing --------------------------------------------------------------------

  - id: pair_start
    mode: single
    then:
      - lambda: 'id(pair_id) = ""; id(now_state) = "connecting";'
      - script.execute: render
      - http_request.post:
          url: ${marquee_url}/tv/pair
          request_headers:
            Content-Type: application/json
          json:
            name: ${friendly_name}
            kind: remote
          capture_response: true
          max_response_buffer_size: 512
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) { id(now_state) = "offline"; return; }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    id(pair_id) = root["pair_id"] | "";
                    id(pair_code) = root["code"] | "";
                    return true;
                  });
                  id(now_state) = id(pair_id).empty() ? "offline" : "pairing";
              - script.execute: render
          on_error:
            - lambda: 'id(now_state) = "offline";'
            - script.execute: render

  # Waiting for the code to be approved in the control panel.
  - id: pair_poll
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(pair_id).empty();'
          then:
            - if:
                condition:
                  and:
                    - wifi.connected
                    - not:
                        script.is_running: pair_start
                then:
                  - script.execute: pair_start
          else:
            - http_request.get:
                url: !lambda 'return std::string("${marquee_url}/tv/pair/") + id(pair_id);'
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code == 404) { id(pair_id) = ""; return; }  // expired: a new code
                        if (response->status_code != 200) return;
                        std::string status, given;
                        json::parse_json(body, [&](JsonObject root) -> bool {
                          status = root["status"] | "";
                          given = root["secret"] | "";
                          return true;
                        });
                        if (status == "approved" && !given.empty()) {
                          auto call = id(secret).make_call();
                          call.set_value(given);
                          call.perform();
                          id(pair_id) = "";
                          id(now_state) = "idle";
                        }
                    - script.execute: render

  # The server forgot the box (removed in the control panel): pair again.
  - id: forget_pairing
    then:
      - lambda: |-
          auto call = id(secret).make_call();
          call.set_value("");
          call.perform();
          id(pair_id) = "";
      - script.execute: pair_start

  # ---- what's playing -------------------------------------------------------------

  - id: refresh
    mode: single
    then:
      - http_request.get:
          url: ${marquee_url}/remote/now
          request_headers:
            Authorization: !lambda 'return id(auth).c_str();'
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 401) { id(now_state) = "unpaired"; return; }
                  if (response->status_code != 200) { id(now_state) = "offline"; return; }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    id(now_state) = root["state"] | "idle";
                    id(now_title) = root["title"] | "";
                    id(now_key) = root["key"] | "";
                    id(now_poster) = root["poster"] | "";
                    id(now_player) = root["player"] | "";
                    id(now_message) = root["message"] | "";
                    id(now_position) = root["position"] | 0;
                    id(now_duration) = root["duration"] | 0;
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return id(now_state) == "unpaired";'
                  then:
                    - script.execute: forget_pairing
                  else:
                    - script.execute: render
          on_error:
            - lambda: 'id(now_state) = "offline";'
            - script.execute: render

  # Update the screen from the globals.
  - id: render
    mode: queued
    max_runs: 3
    then:
      - if:
          condition:
            lambda: |-
              const std::string &s = id(now_state);
              return s == "idle" || s == "offline" || s == "connecting" || s == "pairing";
          then:
            - lvgl.widget.hide: [poster_img, title_lbl, info_lbl, progress, time_lbl, controls]
            - lvgl.label.update:
                id: idle_lbl
                text: !lambda |-
                  const std::string &s = id(now_state);
                  if (s == "connecting") return std::string("Connecting...");
                  if (s == "offline") return std::string("Can't reach Marquee Server\n${marquee_url}");
                  if (s == "pairing") return std::string("Pair with Marquee\n\nApprove this code in\nthe control panel");
                  return std::string("Hold a page of the\nmovie book here");
            - lvgl.label.update:
                id: code_lbl
                text: !lambda 'return id(now_state) == "pairing" ? id(pair_code) : std::string("");'
            - lvgl.widget.show: [idle_lbl, code_lbl]
            - lambda: 'id(shown_key) = "";'
            - if:
                condition:
                  lambda: 'return id(now_state) == "pairing";'
                then:
                  - script.stop: screen_timer
                  - light.turn_on: backlight
                else:
                  - if:
                      condition:
                        not:
                          script.is_running: screen_timer
                      then:
                        - script.execute: screen_timer
          else:
            - script.stop: screen_timer
            - light.turn_on: backlight
            - lvgl.widget.hide: [idle_lbl, code_lbl]
            - lvgl.widget.show: [title_lbl, info_lbl, progress, time_lbl, controls]
            - lvgl.label.update:
                id: title_lbl
                text: !lambda 'return id(now_title);'
            - lvgl.label.update:
                id: info_lbl
                text: !lambda |-
                  const std::string &s = id(now_state);
                  if (s == "starting") return std::string("Starting on ") + id(now_player) + "...";
                  if (s == "error") return id(now_message);
                  if (s == "paused") return std::string("Paused on ") + id(now_player);
                  return std::string("Playing on ") + id(now_player);
            - lvgl.bar.update:
                id: progress
                value: !lambda |-
                  return id(now_duration) > 0 ? id(now_position) * 1000 / id(now_duration) : 0;
            - lvgl.label.update:
                id: time_lbl
                text: !lambda |-
                  auto fmt = [](int t) {
                    char buf[12];
                    snprintf(buf, sizeof(buf), "%d:%02d:%02d", t / 3600, (t / 60) % 60, t % 60);
                    return std::string(buf);
                  };
                  if (id(now_duration) <= 0) return std::string("");
                  return fmt(id(now_position)) + " / " + fmt(id(now_duration));
            - lvgl.label.update:
                id: play_icon
                text: !lambda |-
                  return id(now_state) == "playing" ? std::string(LV_SYMBOL_PAUSE) : std::string(LV_SYMBOL_PLAY);
            # A new movie: fetch its poster, sized for the screen.
            - if:
                condition:
                  lambda: 'return !id(now_poster).empty() && id(now_key) != id(shown_key);'
                then:
                  - lambda: 'id(shown_key) = id(now_key);'
                  - lvgl.widget.hide: poster_img
                  - online_image.set_url:
                      id: poster
                      url: !lambda 'return std::string("${marquee_url}") + id(now_poster) + "?w=200&h=300";'
                  - component.update: poster

  - id: screen_timer
    mode: single
    then:
      - delay: ${screen_timeout}
      - light.turn_off: backlight

  # A button: tell the server, then refresh the screen straight away.
  - id: send_control
    mode: queued
    max_runs: 4
    parameters:
      action: string
      by: int
    then:
      - http_request.post:
          url: ${marquee_url}/remote/control
          request_headers:
            Content-Type: application/json
            Authorization: !lambda 'return id(auth).c_str();'
          json: !lambda |-
            root["action"] = action;
            if (by != 0) root["by"] = by;
      - script.execute: refresh

# ---- NFC reader ------------------------------------------------------------------

i2c:
  sda: ${nfc_sda}
  scl: ${nfc_scl}
  scan: true
  frequency: 100kHz

pn532_i2c:
  id: nfc_reader
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          id(tag_url) = "";
          if (!tag.has_ndef_message()) return;
          for (auto &record : tag.get_ndef_message()->get_records()) {
            std::string payload = record->get_payload();
            if (payload.find("/m/") != std::string::npos) {
              id(tag_url) = payload;
              break;
            }
          }
      - if:
          condition:
            lambda: 'return !id(tag_url).empty() && !id(secret).state.empty();'
          then:
            - light.turn_on: backlight
            - lambda: 'ESP_LOGI("tag", "Read %s", id(tag_url).c_str());'
            - http_request.post:
                url: ${marquee_url}/remote/tap
                request_headers:
                  Content-Type: application/json
                  Authorization: !lambda 'return id(auth).c_str();'
                json:
                  url: !lambda 'return id(tag_url);'
            - script.execute: refresh
          else:
            - logger.log: "Not a movie book tag, or the box isn't paired yet"

# ---- screen and touch --------------------------------------------------------------

# The display and the touch controller share one SPI bus
spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
    frequency: 1000Hz
  # The board's RGB LED, kept off
  - platform: ledc
    id: led_red
    pin: GPIO22
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 300ms
  - platform: rgb
    id: led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: screen
    model: ST7796
    spi_id: lcd
    data_rate: 40MHz
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: false
    dimensions:
      width: 320
      height: 480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: lcd
    cs_pin: GPIO33
    update_interval: 20ms
    threshold: 800
    calibration:
      x_min: 200
      x_max: 3900
      y_min: 200
      y_max: 3900
    on_touch:
      - light.turn_on: backlight

online_image:
  - id: poster
    url: ${marquee_url}/poster/none
    format: JPEG
    type: RGB565
    resize: 200x300
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: poster_img
          src: poster
      - lvgl.widget.show: poster_img

lvgl:
  displays: [screen]
  touchscreens: [touch]
  buffer_size: 8%
  bg_color: 0x101010
  default_font: montserrat_14
  theme:
    button:
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 28
      border_width: 0
      pressed:
        bg_color: 0xE5A00D
  pages:
    - id: main_page
      bg_color: 0x101010
      widgets:
        - label:
            id: idle_lbl
            align: CENTER
            y: -40
            width: 300
            text_align: CENTER
            text_font: montserrat_20
            text_color: 0x9A9A9A
            text: "Connecting..."

        - label:
            id: code_lbl
            align: CENTER
            y: 80
            text_font: montserrat_48
            text_color: 0xE5A00D
            text: ""

        - image:
            id: poster_img
            src: poster
            align: TOP_MID
            y: 12
            hidden: true

        - label:
            id: title_lbl
            align: TOP_MID
            y: 322
            width: 300
            long_mode: DOT
            text_align: CENTER
            text_font: montserrat_20
            text_color: 0xFFFFFF
            text: ""
            hidden: true

        - label:
            id: info_lbl
            align: TOP_MID
            y: 350
            width: 300
            long_mode: DOT
            text_align: CENTER
            text_color: 0x9E9E9E
            text: ""
            hidden: true

        - bar:
            id: progress
            align: TOP_MID
            y: 376
            width: 280
            height: 6
            min_value: 0
            max_value: 1000
            value: 0
            bg_color: 0x333333
            indicator:
              bg_color: 0xE5A00D
            hidden: true

        - label:
            id: time_lbl
            align: TOP_MID
            y: 388
            text_font: montserrat_12
            text_color: 0x9E9E9E
            text: ""
            hidden: true

        - obj:
            id: controls
            align: BOTTOM_MID
            y: -8
            width: 316
            height: 66
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            hidden: true
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_18
                        text: "-30"
                  on_click:
                    - script.execute: { id: send_control, action: seek, by: -30 }
              - button:
                  width: 62
                  height: 62
                  radius: 31
                  bg_color: 0xE5A00D
                  widgets:
                    - label:
                        id: play_icon
                        align: CENTER
                        text_font: montserrat_24
                        text: "\uF04C"
                  on_click:
                    - script.execute: { id: send_control, action: toggle, by: 0 }
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_18
                        text: "+30"
                  on_click:
                    - script.execute: { id: send_control, action: seek, by: 30 }
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_20
                        text: "\uF04D"
                  on_click:
                    - script.execute: { id: send_control, action: stop, by: 0 }
