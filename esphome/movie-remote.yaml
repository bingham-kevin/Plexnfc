# Movie Remote: an NFC reader with a touchscreen for Marquee.
#
# Hold a page of the movie book to the reader and the movie starts on your Marquee
# player. The screen shows the poster of what's playing, a progress bar, and touch
# controls. The box pairs with Marquee Server like Marquee does: it shows a code,
# you approve it in the control panel, and nothing works until you do.
#
# The logic is in common/movie-remote.yaml; this file is the board.
# Hardware: the Hosyond ESP32-32E E32R40T (4" ST7796, 320x480, XPT2046 touch) with a
# PN532 reader in I2C mode on its I2C header. See esphome/README.md.
# Flash with:  esphome run movie-remote.yaml

substitutions:
  name: movie-remote
  friendly_name: Movie Remote
  # Marquee Server's address (no trailing slash)
  marquee_url: http://marquee.local:8080
  # The PN532 on the I2C header: SDA and SCL
  nfc_sda: GPIO32
  nfc_scl: GPIO25
  # Turn the screen off after this long with nothing playing
  screen_timeout: 5min
  # The poster's size: 28 KB, as this ESP32 has no PSRAM
  poster_w: "96"
  poster_h: "144"
  wifi_name_width: "210"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: connect_box

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

packages:
  remote: !include common/movie-remote.yaml

# The PN532 on the I2C header
i2c:
  sda: ${nfc_sda}
  scl: ${nfc_scl}
  scan: true
  frequency: 100kHz

# ---- screen and touch --------------------------------------------------------------

# The display and the touch controller share one SPI bus
spi:
  - id: lcd
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm
    frequency: 1000Hz
  # The board's RGB LED, kept off
  - platform: ledc
    id: led_red
    pin: GPIO22
    inverted: true
  - platform: ledc
    id: led_green
    pin: GPIO16
    inverted: true
  - platform: ledc
    id: led_blue
    pin: GPIO17
    inverted: true

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    # Keeps the brightness chosen on the settings screen
    restore_mode: RESTORE_AND_ON
    default_transition_length: 300ms
  - platform: rgb
    id: led
    red: led_red
    green: led_green
    blue: led_blue
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: screen
    model: ST7796
    spi_id: lcd
    data_rate: 40MHz
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    invert_colors: false
    dimensions:
      width: 320
      height: 480
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: lcd
    cs_pin: GPIO33
    update_interval: 20ms
    threshold: 800
    # Measured on this panel by pressing its corners
    calibration:
      x_min: 360
      x_max: 3600
      y_min: 380
      y_max: 3800
    # Its touch runs bottom to top
    transform:
      mirror_y: true
    on_touch:
      - light.turn_on: backlight

# A placeholder for the poster widget: the poster itself is downloaded and decoded in
# the background by marquee_link
image:
  - platform: online_image
    id: poster
    url: ${marquee_url}/poster/none
    format: JPEG
    type: RGB565
    resize: 16x16
    update_interval: never

lvgl:
  displays: [screen]
  touchscreens: [touch]
  buffer_size: 6%
  bg_color: 0x101010
  default_font: montserrat_14
  theme:
    button:
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 28
      border_width: 0
      pressed:
        bg_color: 0xE5A00D
  pages:
    - id: main_page
      bg_color: 0x101010
      widgets:
        - button:
            id: gear_btn
            align: TOP_LEFT
            x: 10
            y: 10
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  text_font: montserrat_20
                  text_color: 0x9A9A9A
                  text: "\uF013"
            on_click:
              - script.execute: show_settings

        - label:
            id: idle_lbl
            align: CENTER
            y: -40
            width: 300
            text_align: CENTER
            text_font: montserrat_20
            text_color: 0x9A9A9A
            text: "Connecting..."

        - label:
            id: code_lbl
            align: CENTER
            y: 80
            text_font: montserrat_48
            text_color: 0xE5A00D
            text: ""

        - image:
            id: poster_img
            src: poster
            align: TOP_MID
            y: 20
            hidden: true

        # What's playing, stacked under the poster so a two-line title pushes the rest down
        - obj:
            align: TOP_MID
            y: 176
            width: 310
            height: 220
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 8
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - label:
                  id: title_lbl
                  width: 300
                  # Up to two lines, then "..."
                  max_height: 48
                  long_mode: DOT
                  text_align: CENTER
                  text_font: montserrat_20
                  text_color: 0xFFFFFF
                  text: ""
                  hidden: true

              - label:
                  id: info_lbl
                  width: 300
                  long_mode: DOT
                  text_align: CENTER
                  text_color: 0x9E9E9E
                  text: ""
                  hidden: true

              - bar:
                  id: progress
                  width: 280
                  height: 6
                  min_value: 0
                  max_value: 1000
                  value: 0
                  bg_color: 0x333333
                  indicator:
                    bg_color: 0xE5A00D
                  hidden: true

              - label:
                  id: time_lbl
                  text_font: montserrat_12
                  text_color: 0x9E9E9E
                  text: ""
                  hidden: true

        - obj:
            id: controls
            align: BOTTOM_MID
            y: -8
            width: 316
            height: 66
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            hidden: true
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets:
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_18
                        text: "-30"
                  on_click:
                    - script.execute: { id: send_control, action: seek, by: -30 }
              - button:
                  width: 62
                  height: 62
                  radius: 31
                  bg_color: 0xE5A00D
                  widgets:
                    - label:
                        id: play_icon
                        align: CENTER
                        text_font: montserrat_24
                        text: "\uF04C"
                  on_click:
                    - script.execute: { id: send_control, action: toggle, by: 0 }
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_18
                        text: "+30"
                  on_click:
                    - script.execute: { id: send_control, action: seek, by: 30 }
              - button:
                  width: 58
                  height: 54
                  widgets:
                    - label:
                        align: CENTER
                        text_font: montserrat_20
                        text: "\uF04D"
                  on_click:
                    - script.execute: { id: send_control, action: stop, by: 0 }

    - id: settings_page
      bg_color: 0x101010
      widgets:
        - button:
            align: TOP_LEFT
            x: 10
            y: 10
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"
            on_click:
              - lvgl.page.show: main_page
        - label:
            align: TOP_MID
            y: 20
            text_font: montserrat_20
            text_color: 0xFFFFFF
            text: "Settings"
        - label:
            id: info_lbl2
            align: TOP_LEFT
            x: 20
            y: 66
            width: 280
            text_color: 0xC8C8C8
            text_line_space: 1
            text: ""
        - label:
            align: TOP_LEFT
            x: 20
            y: 300
            text_color: 0x9E9E9E
            text: "Brightness"
        - slider:
            id: brightness
            align: TOP_MID
            y: 330
            width: 250
            min_value: 10
            max_value: 100
            value: 100
            bg_color: 0x333333
            indicator:
              bg_color: 0xE5A00D
            knob:
              bg_color: 0xFFFFFF
            on_value:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda 'return x / 100.0f;'
                  transition_length: 0s
        - button:
            align: TOP_MID
            y: 362
            width: 280
            height: 46
            radius: 12
            widgets:
              - label:
                  align: CENTER
                  text: "\uF1EB   Change Wi-Fi"
            on_click:
              - script.execute: wifi_scan
        - button:
            align: TOP_MID
            y: 418
            width: 280
            height: 46
            radius: 12
            bg_color: 0x4A1C1C
            widgets:
              - label:
                  align: CENTER
                  text_color: 0xFF8A80
                  text: "Reset to defaults"
            on_click:
              - lvgl.label.update:
                  id: reset_lbl
                  text: "Reset Movie Remote?\n\nIt forgets its Wi-Fi network and its pairing with Marquee Server, then starts setup again from the Movie Remote hotspot."
              - lvgl.page.show: reset_page

    - id: wifi_page
      bg_color: 0x101010
      widgets:
        - button:
            align: TOP_LEFT
            x: 10
            y: 10
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"
            on_click:
              - script.execute: show_settings
        - label:
            align: TOP_MID
            y: 20
            text_font: montserrat_20
            text_color: 0xFFFFFF
            text: "Wi-Fi"
        - button:
            align: TOP_RIGHT
            x: -10
            y: 10
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  text: "\uF021"
            on_click:
              - script.execute: wifi_scan
        - label:
            id: wifi_status
            align: TOP_MID
            y: 64
            text_color: 0x9E9E9E
            text: ""
        - obj:
            id: wifi_list
            align: TOP_MID
            y: 92
            width: 300
            height: 380
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: true

    - id: password_page
      bg_color: 0x101010
      widgets:
        - button:
            align: TOP_LEFT
            x: 10
            y: 10
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  text: "\uF053"
            on_click:
              - lvgl.page.show: wifi_page
        - label:
            id: pw_title
            align: TOP_MID
            y: 20
            width: 200
            long_mode: DOT
            text_align: CENTER
            text_font: montserrat_18
            text_color: 0xFFFFFF
            text: ""
        - textarea:
            id: pw_ta
            align: TOP_LEFT
            x: 10
            y: 76
            width: 230
            height: 46
            one_line: true
            password_mode: true
            placeholder_text: "Password"
            max_length: 64
        - button:
            id: pw_show
            align: TOP_RIGHT
            x: -10
            y: 76
            width: 66
            height: 46
            radius: 12
            widgets:
              - label:
                  id: pw_show_lbl
                  align: CENTER
                  text: "Show"
            on_click:
              - lambda: |-
                  bool hidden = lv_textarea_get_password_mode(id(pw_ta));
                  lv_textarea_set_password_mode(id(pw_ta), !hidden);
                  lv_label_set_text(id(pw_show_lbl), hidden ? "Hide" : "Show");
        - label:
            align: TOP_MID
            y: 136
            width: 300
            text_align: CENTER
            text_color: 0x9E9E9E
            text: "Press the check key to join"
        - keyboard:
            id: pw_kb
            textarea: pw_ta
            align: BOTTOM_MID
            width: 320
            height: 230
            on_ready:
              - script.execute: wifi_join
            on_cancel:
              - lvgl.page.show: wifi_page

    - id: reset_page
      bg_color: 0x101010
      widgets:
        - label:
            id: reset_lbl
            align: CENTER
            y: -60
            width: 280
            text_align: CENTER
            text_font: montserrat_18
            text_color: 0xFFFFFF
            text: ""
        - button:
            align: BOTTOM_LEFT
            x: 20
            y: -30
            width: 130
            height: 50
            radius: 12
            widgets:
              - label:
                  align: CENTER
                  text: "Cancel"
            on_click:
              - lvgl.page.show: settings_page
        - button:
            align: BOTTOM_RIGHT
            x: -20
            y: -30
            width: 130
            height: 50
            radius: 12
            bg_color: 0xC62828
            widgets:
              - label:
                  align: CENTER
                  text: "Reset"
            on_click:
              - script.execute: reset_box

# Sounds for taps and card scans (see common/movie-remote.yaml). This board has no
# speaker, so they're silent.
script:
  - id: feedback
    parameters:
      kind: string
    then:
      - logger.log:
          format: "Sound: %s"
          args: ["kind.c_str()"]
          level: VERBOSE
